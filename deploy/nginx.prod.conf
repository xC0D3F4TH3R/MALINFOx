# MALINFO — Production Nginx Configuration
#
# This configuration serves the frontend and reverse-proxies the API.
# TLS is terminated at Cloudflare Tunnel (or at this level if using direct TLS).
# Includes security headers, rate limiting, WebSocket support, and proper proxy settings.

events {
    worker_connections 1024;
}

http {
    # Upstream backend servers
    upstream malinfo_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream ICAP (if enabled)
    upstream malinfo_icap {
        server icap:1344 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=public_report:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Hide nginx version
    server_tokens off;

    # Buffer settings for large uploads
    client_body_buffer_size 128k;
    client_max_body_size 260M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;

    # HTTP server - works with Cloudflare Tunnel (TLS terminated at edge)
    # If using direct TLS, uncomment the SSL config below and comment out this server block
    server {
        listen 80;
        server_name _;

        # ACME challenge for Let's Encrypt (if using direct TLS)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Security Headers (also applied when TLS at edge)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # Root for static frontend
        root /usr/share/nginx/html;
        index index.html;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/rss+xml application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;

        # Frontend - SPA routing
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # API endpoints
        location /api/ {
            # Rate limiting
            limit_req zone=api burst=20 nodelay;

            # Stricter rate limiting for public endpoints
            location /api/public/report/ {
                limit_req zone=public_report burst=3 nodelay;
            }

            # Stricter rate limiting for uploads
            location /api/upload {
                limit_req zone=upload burst=5 nodelay;
            }

            # Stricter rate limiting for auth
            location /api/auth/login {
                limit_req zone=login burst=3 nodelay;
            }

            proxy_pass http://malinfo_backend;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            # Caching for GET requests
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;

            # Pass through response headers
            proxy_pass_header Set-Cookie;
            proxy_pass_header X-Request-ID;
        }

        # Static reports (read-only access)
        location /reports-static/ {
            proxy_pass http://malinfo_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache reports for 1 hour
            expires 1h;
            add_header Cache-Control "public";
        }

        # Health check endpoint (no rate limiting)
        location /api/health {
            proxy_pass http://malinfo_backend;
            access_log off;
        }

        # ICAP proxy (if needed for external access)
        # location /icap/ {
        #     proxy_pass http://malinfo_icap;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
    }

