# MALINFO — nginx reverse proxy
#
# Serves the static frontend and reverse-proxies /api/* to the backend.
# For a real government deployment:
#   1. Terminate TLS here (certbot/Let's Encrypt, or your CA-issued cert)
#      and redirect :80 -> :443.
#   2. Add rate limiting on the public reporting endpoints — they accept
#      anonymous, unauthenticated submissions and are an abuse target:
#        limit_req_zone $binary_remote_addr zone=public_report:10m rate=5r/m;
#        location /api/public/report/ { limit_req zone=public_report burst=3; ... }
#   3. Put this whole stack behind a WAF if internet-facing.

server {
    listen 80;
    server_name _;

    client_max_body_size 260M;  # match MAX_UPLOAD_SIZE_MB in backend config

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # analysis polling can take a while
    }

    location /reports-static/ {
        proxy_pass http://backend:8000/reports-static/;
    }
}
