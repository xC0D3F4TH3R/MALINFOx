[project]
name = "malinfo-backend"
version = "1.0.0-pilot"
description = "MALINFO Backend - Malware Analysis Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "asyncpg==0.31.0",
    "python-magic==0.4.27",
    "pefile==2024.8.26",
    "pyelftools==0.31",
    "macholib==1.16.3",
    "yara-python==4.5.1",
    "ssdeep==3.4",
    "androguard==3.3.5",
    "scapy==2.6.0",
    "dnspython==2.6.1",
    "requests==2.32.3",
    "aiohttp==3.9.5",
    "jinja2==3.1.4",
    "weasyprint==62.3",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "pyotp==2.9.0",
    "qrcode==7.4.2",
    "pillow==10.4.0",
    "watchdog==4.0.1",
    "psutil==5.9.8",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "email-validator==2.1.0",
    "prometheus-client==0.19.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP", "PIE", "T20", "DTZ", "RUF", "ARG", "PTH", "ERA", "PL", "TRY", "NPY", "BLE", "SIM", "TCH", "INT", "QF"]
ignore = ["E501", "B008", "BLE001", "TRY003", "ARG001", "ARG002"]
per-file-ignores = { "tests/*" = ["S101", "S106"] }

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
allow_untyped_globals = true
allow_untyped_calls = true
implicit_reexport = false

[[tool.mypy.overrides]]
module = [
    "pefile", "pyelftools.*", "macholib.*", "magic", "yara",
    "androguard.*", "scapy.*", "olefile", "olevba", "fitz",
    "esprima", "ssdeep", "watchdog.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["config", "tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --asyncio-mode=auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.bandit]
targets = ["app"]
exclude_dirs = ["tests", "__pycache__", ".pytest_cache"]
skip = ["B101", "B601"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
