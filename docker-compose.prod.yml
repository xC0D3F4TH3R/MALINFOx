# MALINFO — Production Docker Compose
#
# This compose file brings up the complete MALINFO stack:
# - PostgreSQL database
# - Redis for caching/sessions
# - Backend API (FastAPI)
# - Nginx reverse proxy + static frontend
# - ICAP gateway (optional)
# - Monitoring service (optional)
#
# For production deployment:
# 1. Copy .env.example to .env and fill in ALL secrets
# 2. Configure TLS certificates in deploy/certs/
# 3. Run: docker compose -f docker-compose.prod.yml up -d --build

version: "3.9"

services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: malinfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: malinfo
    volumes:
      - malinfo_db_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malinfo"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # --- Redis for caching, sessions, rate limiting ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - malinfo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- PostgreSQL Exporter ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://malinfo:${POSTGRES_PASSWORD}@db:5432/malinfo?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "9187"
    profiles:
      - monitoring

  # --- Redis Exporter ---
  redis-exporter:
    image: oliver006/redis_exporter:v1.60.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9121"
    profiles:
      - monitoring

  # --- Node Exporter ---
  node-exporter:
    image: prom/node-exporter:v1.8.0
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    profiles:
      - monitoring

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://malinfo:${POSTGRES_PASSWORD}@db:5432/malinfo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - malinfo_storage:/app/storage
      - malinfo_yara_rules:/app/app/rules/yara:ro
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2"
        reservations:
          memory: 2G
          cpus: "1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- ICAP Gateway (optional - for network gateway integration) ---
  icap:
    build:
      context: ./backend
      dockerfile: Dockerfile.icap
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://malinfo:${POSTGRES_PASSWORD}@db:5432/malinfo
      REDIS_URL: redis://redis:6379/0
      ICAP_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "1344:1344"
    volumes:
      - malinfo_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    profiles:
      - icap

  # --- Monitoring Service (optional - for file transfer monitoring) ---
  monitor:
    build:
      context: ./backend
      dockerfile: Dockerfile.monitor
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://malinfo:${POSTGRES_PASSWORD}@db:5432/malinfo
      REDIS_URL: redis://redis:6379/0
      MONITOR_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - malinfo_storage:/app/storage
      - /var/mail:/host/var/mail:ro
      - /home:/host/home:ro
      - /tmp:/host/tmp:ro
    cap_add:
      - SYS_RESOURCE
      - DAC_READ_SEARCH
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    profiles:
      - monitor

  # --- Nginx Reverse Proxy + Static Frontend ---
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
      - malinfo_storage:/app/storage:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # --- Prometheus (optional - for metrics) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.route-prefix=/'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - malinfo_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring

  # --- Grafana (optional - for dashboards) ---
  grafana:
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - malinfo_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  malinfo_db_data:
  malinfo_redis_data:
  malinfo_storage:
  malinfo_yara_rules:
  malinfo_prometheus_data:
  malinfo_grafana_data:

networks:
  default:
    name: malinfo-network