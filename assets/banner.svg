<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0883e;stop-opacity:1" />
    </linearGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bannerBg)"/>
  
  <!-- Animated grid lines -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="0" x2="1200" y2="400"/>
    <line x1="1200" y1="0" x2="0" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>
  
  <!-- Floating particles -->
  <g fill="#58a6ff" opacity="0.4">
    <circle cx="100" cy="80" r="2">
      <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="320" r="1.5">
      <animate attributeName="cy" values="320;300;320" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="120" r="1">
      <animate attributeName="cy" values="120;100;120" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="280" r="2.5">
      <animate attributeName="cy" values="280;260;280" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Central glowing shield -->
  <g transform="translate(600, 200)">
    <path d="M0 -80 
             C0 -80, 0 -90, 0 -90
             L140 -55
             C140 -55, 150 -45, 140 -35
             L0 85
             L-140 -35
             C-150 -45, -140 -55, -140 -55
             L0 -60
             Z" 
          fill="url(#shieldGrad)" 
          filter="url(#cardGlow)"
          stroke="#ffffff"
          stroke-width="1.5"
          opacity="0.9"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="150" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="56" 
        font-weight="800" 
        fill="url(#textGrad)" 
        text-anchor="middle"
        letter-spacing="6"
        filter="url(#textGlow)">
    MALINFO
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="210" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="400" 
        fill="#8b949e" 
        text-anchor="middle"
        letter-spacing="2">
    GOVERNMENT-GRADE MALWARE ANALYSIS PLATFORM
  </text>
  
  <!-- Feature badges -->
  <g transform="translate(600, 260)">
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <rect x="-180" y="-18" width="120" height="36" rx="18" fill="#161b22" stroke="#58a6ff" stroke-width="1" opacity="0.9"/>
      <text x="-120" y="5" fill="#58a6ff">🔬 Static Analysis</text>
    </g>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <rect x="-30" y="-18" width="60" height="36" rx="18" fill="#161b22" stroke="#f0883e" stroke-width="1" opacity="0.9"/>
      <text x="0" y="5" fill="#f0883e">☁️ VM Sandbox</text>
    </g>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      <rect x="100" y="-18" width="80" height="36" rx="18" fill="#161b22" stroke="#a371f7" stroke-width="1" opacity="0.9"/>
      <text x="140" y="5" fill="#a371f7">🧠 Threat Intel</text>
    </g>
  </g>
  
  <!-- Bottom tagline -->
  <text x="600" y="360" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="14" 
        font-weight="400" 
        fill="#484f58" 
        text-anchor="middle"
        letter-spacing="1">
    Built for National Cyber Defense · CERTs · SOCs · Law Enforcement
  </text>
</svg>