      <text x="20" y="155" fill="#8b949e">T1003 ███████████████████░░░░░░░░  489</text>
      <text x="20" y="175" fill="#8b949e">T1071 ██████████████████░░░░░░░░░  456</text>
      <text x="20" y="195" fill="#8b949e">T1105 ██████████████████░░░░░░░░░  432</text>
      <text x="20" y="215" fill="#8b949e">T1082 █████████████████░░░░░░░░░░  401</text>
      <text x="20" y="235" fill="#8b949e">T1112 ████████████████░░░░░░░░░░░  378</text>
    </g>
  </g>
  
  <!-- Dashboard Row 2: YARA Performance -->
  <g transform="translate(820, 340)">
    <rect x="0" y="0" width="360" height="240" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" filter="url(#grafanaGlow)"/>
    <text x="20" y="30" font-family="system-ui" font-size="16" font-weight="700" fill="#3fb950">📏 YARA Performance</text>
    
