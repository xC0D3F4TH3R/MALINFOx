      <text x="80" y="20" font-family="system-ui" font-size="10" fill="#f0883e" text-anchor="middle">Ubuntu</text>
      <text x="140" y="20" font-family="system-ui" font-size="10" fill="#a371f7" text-anchor="middle">Android</text>
