    <text x="20" y="230" font-family="system-ui" font-size="11" fill="#484f58">API Requests/sec (last 6h)</text>
  </g>
  
  <!-- Dashboard Row 1: Analysis Pipeline -->
  <g transform="translate(420, 80)">
