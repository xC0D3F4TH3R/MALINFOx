    <text x="20" y="30" font-family="system-ui" font-size="16" font-weight="700" fill="#58a6ff">📊 System Overview</text>
    
    <!-- Sparkline placeholders -->
    <g font-family="monospace" font-size="12" fill="#8b949e">
      <text x="20" y="70">CPU Usage    ████████░░  72%</text>
      <text x="20" y="95">Memory       ██████████░  85%</text>
      <text x="20" y="120">Disk         █████░░░░░  45%</text>
      <text x="20" y="145">Network In   ████░░░░░░  1.2 Gbps</text>
      <text x="20" y="170">Network Out  ███░░░░░░░  800 Mbps</text>
      <text x="20" y="195">TLS Expiry   247 days</text>
    </g>
    
    <!-- Mini chart -->
