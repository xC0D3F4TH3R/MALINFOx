  <!-- Footer -->
  <text x="600" y="590" font-family="system-ui" font-size="11" fill="#484f58" text-anchor="middle">MALINFO v2.0.0 · Grafana Dashboards · Replace with real screenshot: assets/grafana-dashboard.png</text>
