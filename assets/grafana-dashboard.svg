    <circle cx="300" cy="200" r="30" fill="none" stroke="#f85149" stroke-width="12" stroke-dasharray="94.2 94.2" stroke-dashoffset="94.2"/>
    <circle cx="300" cy="200" r="30" fill="none" stroke="#f0883e" stroke-width="12" stroke-dasharray="94.2 94.2" stroke-dashoffset="188.4"/>
    <text x="300" y="205" font-family="system-ui" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">42/28/30</text>
  </g>
  
