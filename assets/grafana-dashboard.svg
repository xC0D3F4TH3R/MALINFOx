  <text x="20" y="40" font-family="system-ui" font-size="18" font-weight="700" fill="#58a6ff">Grafana  ▲  MALINFO Dashboards</text>
  <text x="1100" y="40" font-family="system-ui" font-size="12" fill="#8b949e" text-anchor="end">Last 6h ▼  Auto-refresh: 30s</text>
  
  <!-- Dashboard Row 1: System Overview -->
  <g transform="translate(20, 80)">
