      <rect x="120" y="0" width="40" height="-140" rx="2" fill="#a371f7"/>
      <rect x="180" y="0" width="40" height="-80" rx="2" fill="#3fb950"/>
      <rect x="240" y="0" width="40" height="-160" rx="2" fill="#f85149"/>
