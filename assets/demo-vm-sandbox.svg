<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="demoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="demoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="vmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a371f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#demoBg)"/>
  
  <!-- Grid -->
  <g stroke="#f0883e" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="0" x2="800" y2="450"/>
    <line x1="800" y1="0" x2="0" y2="450"/>
  </g>
  
  <!-- VM Sandbox flow diagram -->
  <g transform="translate(400, 225)" filter="url(#demoGlow)">
    <!-- ISO -->
    <rect x="-350" y="-100" width="140" height="50" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0.9"/>
    <text x="-280" y="-68" font-family="system-ui" font-size="14" font-weight="700" fill="#f0883e" text-anchor="middle">📀 ISO Upload</text>
    <text x="-280" y="-48" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">Win/Linux/Android</text>
    
    <!-- Arrow 1 -->
    <path d="M-210 -75 L-150 -75" stroke="url(#vmGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="url(#vmGrad)"/>
      </marker>
    </defs>
    
    <!-- Template Builder -->
    <rect x="-140" y="-100" width="160" height="50" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2" opacity="0.9"/>
    <text x="-60" y="-68" font-family="system-ui" font-size="14" font-weight="700" fill="#a371f7" text-anchor="middle">🔨 Template Builder</text>
    <text x="-60" y="-48" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">Auto-install OS + Agent</text>
    
    <!-- Arrow 2 -->
    <path d="M20 -75 L80 -75" stroke="url(#vmGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Clean Snapshot -->
    <rect x="90" y="-100" width="140" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2" opacity="0.9"/>
    <text x="160" y="-68" font-family="system-ui" font-size="14" font-weight="700" fill="#3fb950" text-anchor="middle">📸 Clean Snapshot</text>
    <text x="160" y="-48" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">COW Disk + virtio-blk</text>
    
    <!-- Arrow 3 -->
    <path d="M230 -75 L290 -75" stroke="url(#vmGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Instance Launch -->
    <rect x="300" y="-100" width="140" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2" opacity="0.9"/>
    <text x="370" y="-68" font-family="system-ui" font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">🚀 Instance Launch</text>
    <text x="370" y="-48" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">Isolated Network</text>
    
    <!-- Guest Agent box below -->
    <rect x="-50" y="20" width="220" height="80" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2" opacity="0.9" filter="url(#demoGlow)"/>
    <text x="60" y="55" font-family="system-ui" font-size="16" font-weight="700" fill="#58a6ff" text-anchor="middle">🤖 Guest Agent (virtio-serial)</text>
    <text x="60" y="75" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">Process Tree • API Calls • Files • Registry</text>
    <text x="60" y="90" font-family="system-ui" font-size="11" fill="#8b949e" text-anchor="middle">Network • Screenshots • Memory Dumps</text>
    
    <!-- Arrow from instance to agent -->
    <path d="M370 -50 Q370 0 60 20" stroke="url(#vmGrad)" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="24" 
        font-weight="700" 
        fill="#f0883e" 
        text-anchor="middle"
        filter="url(#demoGlow)">
    ☁️ VM Sandbox Demo Placeholder
  </text>
  
  <!-- Recording indicator -->
  <g transform="translate(400, 380)">
    <circle r="12" fill="#f85149" opacity="0.3">
      <animate attributeName="r" values="12;16;12" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#f85149">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="35" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle" font-weight="bold">● REC</text>
  </g>
  
  <!-- Bottom note -->
  <text x="400" y="430" font-family="system-ui" font-size="10" fill="#484f58" text-anchor="middle">Replace with real GIF: assets/demo-vm-sandbox.gif</text>
</svg>