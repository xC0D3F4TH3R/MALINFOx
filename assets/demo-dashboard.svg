<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="demoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <filter id="demoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#demoBg)"/>
  
  <!-- Grid -->
  <g stroke="#58a6ff" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="0" x2="800" y2="450"/>
    <line x1="800" y1="0" x2="0" y2="450"/>
  </g>
  
  <!-- Placeholder text -->
  <text x="400" y="180" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="#58a6ff" 
        text-anchor="middle"
        filter="url(#demoGlow)">
    📊 Dashboard Demo Placeholder
  </text>
  
  <text x="400" y="230" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="16" 
        font-weight="400" 
        fill="#8b949e" 
        text-anchor="middle">
    Record a GIF of the live dashboard showing:<br/>
    • Real-time analysis queue<br/>
    • Sample upload & progress<br/>
    • Live MITRE ATT&CK mapping<br/>
    • Interactive sample drill-down
  </text>
  
  <!-- Animated recording indicator -->
  <g transform="translate(400, 350)">
    <circle r="12" fill="#f85149" opacity="0.3">
      <animate attributeName="r" values="12;16;12" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#f85149">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="35" font-family="monospace" font-size="12" fill="#f85149" text-anchor="middle" font-weight="bold">● REC</text>
  </g>
  
  <!-- Corner badge -->
  <text x="20" y="25" font-family="system-ui" font-size="11" fill="#484f58" font-weight="600">MALINFO v2.0.0</text>
  <text x="720" y="435" font-family="system-ui" font-size="10" fill="#484f58">Add real GIF: assets/demo-dashboard.gif</text>
</svg>