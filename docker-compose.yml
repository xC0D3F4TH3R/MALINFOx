version: "3.9"

# MALINFO — pilot deployment compose file.
#
# This brings up: the backend API, a Postgres database (swap in for the
# SQLite default), and nginx serving the static frontend + reverse-proxying
# the API. It deliberately does NOT bring up a CAPEv2 sandbox cluster —
# that is real virtualization infrastructure that must be provisioned
# separately per backend/app/sandbox/README.md, then pointed to via
# SANDBOX_API_URL in .env.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: malinfo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: malinfo
    volumes:
      - malinfo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malinfo"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://malinfo:${POSTGRES_PASSWORD}@db:5432/malinfo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - malinfo_storage:/app/storage
      - /var/lib/libvirt:/var/lib/libvirt:rw
      - /dev/kvm:/dev/kvm:rw
      - /run/libvirt:/run/libvirt:rw
    expose:
      - "8000"
    cap_add:
      - SYS_ADMIN
      - CAP_DAC_OVERRIDE
      - CAP_SYS_RESOURCE
    security_opt:
      - apparmor:unconfined

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Terminate real TLS here in production (443:443 + certs), see
      # deploy/nginx.conf comments for the certbot / cert-manager notes.
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  malinfo_db_data:
  malinfo_storage:

# ------------------------------------------------------------------------
# NOT included here (deliberately — these are separate infrastructure):
#
#   cape-controller:   The CAPEv2 dynamic-sandbox cluster. Deploy per
#                       backend/app/sandbox/README.md, then set
#                       SANDBOX_API_URL + SANDBOX_ENABLED=true in .env.
#
#   inetsim / fakenet: Simulated-internet services for safe malware
#                       detonation — run alongside the CAPEv2 guest VMs,
#                       not as part of this application stack.
# ------------------------------------------------------------------------
